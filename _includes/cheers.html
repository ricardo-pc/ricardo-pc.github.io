<div class="rpc-cheer-wrap">
<button
  class="rpc-cheer-launcher"
  id="rpc-cheer-launcher"
  type="button"
  aria-haspopup="dialog"
  aria-controls="rpc-cheer-dialog"
>
  <span class="rpc-cheer-launcher-icon" aria-hidden="true">♥</span>
  <span>Send a little boost</span>
</button>
</div>

<dialog
  class="rpc-cheer-dialog"
  id="rpc-cheer-dialog"
  aria-labelledby="rpc-cheer-title"
  aria-describedby="rpc-cheer-intro"
>
  <div class="rpc-cheer-panel">
    <button class="rpc-cheer-close" type="button" aria-label="Close boost station">×</button>

    <p class="rpc-cheer-eyebrow">Ricardo's boost station</p>
    <h2 id="rpc-cheer-title">Send love or send strength</h2>
    <p class="rpc-cheer-intro" id="rpc-cheer-intro">
      No note, name, or inbox needed. Pick what today calls for.
    </p>

    <div class="rpc-cheer-options">
      <button class="rpc-cheer-option rpc-cheer-love" type="button" data-cheer="love">
        <span class="rpc-cheer-option-icon" aria-hidden="true">♥</span>
        <span class="rpc-cheer-option-copy">
          <strong>Send love</strong>
          <small>“You are doing better than you think.”</small>
        </span>
      </button>
      <button class="rpc-cheer-option rpc-cheer-strength" type="button" data-cheer="strength">
        <span class="rpc-cheer-option-icon" aria-hidden="true">⚡</span>
        <span class="rpc-cheer-option-copy">
          <strong>Send strength</strong>
          <small>“Keep moving forward. You can do it.”</small>
        </span>
      </button>
    </div>

    <div class="rpc-cheer-receipt" aria-live="polite" aria-atomic="true">
      <p class="rpc-cheer-status" id="rpc-cheer-status">
        Send one—or both. A little encouragement goes a long way.
      </p>
      <div class="rpc-cheer-meter" aria-hidden="true">
        <span id="rpc-cheer-meter-fill"></span>
      </div>
      <p class="rpc-cheer-counts" id="rpc-cheer-counts">This visit: 0 love · 0 strength</p>
    </div>

    <div class="rpc-cheer-effects" aria-hidden="true"></div>
  </div>
</dialog>

<script defer src="/cheers.js?v=20260903-2"></script>
